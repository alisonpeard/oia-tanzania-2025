[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "ttra"
dynamic = ["version"]
description = "Supporting package for Tanzania Transport Resilience Analysis."
authors = [{ name = "Tom Russell", email = "tom.russell@ouce.ox.ac.uk" }]
readme = "README.md"
requires-python = ">=3.10"

[tool.hatch.version]
source = "vcs"
